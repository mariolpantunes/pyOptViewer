# CI gate. .pre-commit-config.yaml runs the same checks at commit time:
# change both in the same commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Lint tools pinned to the versions the pre-commit hooks run locally.
      - name: Install system tools
        run: pipx install ruff==0.16.6 basedpyright==1.39.10 vulture==2.16

      - name: Create venv (runtime deps + test group)
        run: |
          python -m venv venv
          venv/bin/pip install -q --upgrade "pip>=25.1"
          venv/bin/pip install -q . --group test

      - name: ruff
        run: ruff check optviewer tests

      - name: ruff format
        run: ruff format --check optviewer tests

      - name: basedpyright
        run: basedpyright

      - name: vulture
        run: vulture

      - name: JavaScript syntax
        run: for f in static/js/*.js; do node --check "$f"; done

      - name: unittest + coverage
        run: |
          PYTHONPATH=. venv/bin/python -m coverage run --source=optviewer -m unittest discover -s tests -q
          venv/bin/python -m coverage report --fail-under=90
