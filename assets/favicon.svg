<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon / app icon: logo.svg's landscape and search path on a dark tile,
       without the axes and wordmark that vanish at 16-32 px. -->
  <defs>
    <linearGradient id="surf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88c0d0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#88c0d0" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#2e3440" />
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#4c566a" stroke-width="2" />

  <g transform="translate(32 31) scale(0.155)">
    <path d="M -140,-150 C -80,-100 -20,-220 40,-160 S 140,-60 140,0 L 140,180
             C 80,200 20,100 -40,140 S -120,50 -140,30 Z" fill="url(#surf)" />

    <g stroke="#88c0d0" stroke-width="7" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M -140,-150 C -80,-100 -20,-220 40,-160 S 140,-60 140,0" />
      <path d="M -140,-60 C -80,-10 -20,-130 40,-70 S 140,30 140,90" />
      <path d="M -140,30 C -120,50 -40,140 20,100 S 80,200 140,180" />
      <path d="M -140,-150 L -140,30" />
      <path d="M 0,-170 L 0,110" />
      <path d="M 140,0 L 140,180" />
    </g>

    <path d="M -110,-145 Q -50,-120 -30,-80 T 40,0 T 110,150"
          stroke="#eceff4" stroke-width="9" stroke-dasharray="20,12" fill="none" stroke-linecap="round" />

    <g stroke="#2e3440" stroke-width="6">
      <circle cx="-110" cy="-145" r="22" fill="#bf616a" />
      <circle cx="-30" cy="-80" r="18" fill="#ebcb8b" />
      <circle cx="40" cy="0" r="18" fill="#ebcb8b" />
      <circle cx="110" cy="150" r="28" fill="#a3be8c" />
    </g>
  </g>
</svg>
